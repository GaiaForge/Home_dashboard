; GaiaForge garden valve controller — standalone ESP32 + relay board.
;
; Autonomous irrigation node: runs schedules + soil thresholds locally, drives
; valve relays, and exposes a small HTTP API the MicroClimate wall panel talks
; to directly over WiFi. It never depends on the panel or server to water — the
; network is only for config, status, and manual override.
;
; Target: classic ESP32 dev board (the garden unit, CH340 USB-UART bridge).

[env:valve_esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32dev
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
