; PlatformIO project for Waveshare ESP32-S3-Touch-LCD-5 (and -5B)
; Uses the pioarduino platform (arduino-esp32 3.x), which is required by
; Espressif's ESP32_Display_Panel library (vendored in lib/ from Waveshare's
; own demo repo, so versions are pinned and known-good together).

[env:waveshare_s3_lcd5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; The board is an ESP32-S3 with 16 MB flash and 8 MB octal PSRAM (S3-N16R8)
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

monitor_speed = 115200

; ArduinoJson for parsing the MicroClimate server's /api/nodes response.
; Pinned so it can't drift. Only dependency not vendored in lib/.
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -D BOARD_HAS_PSRAM
    ; Route Arduino's Serial to the native USB port (the "USB" connector) rather
    ; than UART0 on the pin header. Without these, ESP-IDF driver logs still show
    ; up over USB but Serial.println() from the sketch goes out pins you aren't
    ; plugged into, so the app looks silent even when it is running fine.
    ;   ARDUINO_USB_MODE=1        -> use the built-in USB-Serial-JTAG peripheral
    ;   ARDUINO_USB_CDC_ON_BOOT=1 -> bind Serial to it at startup
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; LVGL: pick up include/lv_conf.h
    -D LV_CONF_INCLUDE_SIMPLE
    ; let generated font files (src/wi_font.c) include lvgl.h the simple way
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include

; LVGL 9.5.0 is vendored in lib/lvgl (extracted from Waveshare's demo repo),
; so no external lib_deps are needed — the project is fully self-contained.
